name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Supabase CLI 설정
        uses: supabase/setup-cli@v3

      - name: local Supabase 시작
        run: supabase start

      - name: local Supabase 환경 변수 export
        run: |
          SUPABASE_STATUS="$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$SUPABASE_STATUS" | sed -n 's/^API_URL="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$SUPABASE_STATUS" | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$SUPABASE_STATUS" | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: lint 실행
        run: npm run lint

      - name: typecheck 실행
        run: npm run typecheck

      - name: unit test 실행
        run: npm run test

      - name: E2E smoke test 실행
        run: npm run test:e2e

      - name: production build 검증
        run: npm run build
